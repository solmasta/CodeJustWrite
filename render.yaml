# Render.com Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render click New > Blueprint
# and point it at the repo. Render reads this file automatically.
services:
  - type: web
    name: codejustwrite-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: CJW_AUTH_TOKEN
        sync: false # set to a long random secret in the Render dashboard
      - key: DEEPINFRA_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CJW_MCP_SERVERS
        sync: false # optional: JSON array of MCP connectors, see README.md
      - key: CJW_GOOGLE_CLIENT_ID
        sync: false # optional: "Save to Drive" backups, see README.md
      - key: CJW_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CJW_GOOGLE_REFRESH_TOKEN
        sync: false # set after completing the one-time /api/google/connect flow
      - key: CJW_DEFAULT_PROVIDER
        value: deepinfra
      - key: CJW_SESSION_TTL_MIN
        value: "120"
      - key: CJW_MAX_SESSIONS
        value: "20"
